name: Node CI (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      run-typecheck:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      working-directory:
        type: string
        default: '.'
      build-env:
        type: string
        default: ''
        description: >-
          Newline-delimited KEY=VALUE pairs exported before `npm run build`.
          Use dummy/non-secret values here only (e.g. a syntactically valid
          but unreachable DATABASE_URL) to satisfy build-time env validation
          that SKIP_ENV_VALIDATION doesn't cover. Never put real secrets here
          — use `secrets: inherit` + repo secrets for those.
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: npm
          cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'
      - run: npm ci
      - if: ${{ inputs.run-typecheck }}
        run: npx tsc --noEmit --pretty false
      - if: ${{ inputs.run-build && inputs.build-env != '' }}
        run: echo "${{ inputs.build-env }}" >> "$GITHUB_ENV"
      - if: ${{ inputs.run-build }}
        run: npm run build
        env: {SKIP_ENV_VALIDATION: '1'}
      - run: npm test --if-present
